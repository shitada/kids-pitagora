<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ころころピタゴラこうじょう" />
  <meta name="description" content="パーツをおいて ボールをゴールまで はこぶ、こども向けの3Dぶつりパズル。" />
  <meta name="theme-color" content="#2b3a67" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./favicon.svg" />
  <title>ころころピタゴラこうじょう — Kids Pitagora Factory</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #cfe3f2;
      font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      touch-action: none;
      color: #22314f;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      touch-action: none;
    }
    #hud, #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      pointer-events: none;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
    #hud { z-index: 10; }
    #ui-overlay { z-index: 20; }
    #hud > *, #ui-overlay > * {
      pointer-events: auto;
    }
    button {
      font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #orientation-hint {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #2b3a67;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    #orientation-hint .oh-icon {
      font-size: clamp(56px, 18vw, 110px);
      animation: oh-turn 2.2s ease-in-out infinite;
    }
    #orientation-hint .oh-text {
      font-size: clamp(22px, 6vw, 34px);
      font-weight: 900;
      line-height: 1.5;
    }
    #orientation-hint .oh-sub {
      font-size: clamp(14px, 3.4vw, 18px);
      opacity: 0.85;
    }
    @keyframes oh-turn {
      0%, 45% { transform: rotate(0deg); }
      60%, 95% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }
    @media (pointer: coarse) and (orientation: portrait) {
      #orientation-hint { display: flex; }
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: linear-gradient(180deg, #dbeafe, #bfd8ee);
      color: #2b3a67;
      font-weight: 900;
      font-size: clamp(20px, 5vw, 32px);
      transition: opacity 0.35s ease;
    }
    #boot-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="hud"></div>
  <div id="ui-overlay"></div>
  <div id="boot-splash">⚙️ よみこみちゅう…</div>
  <div id="orientation-hint">
    <div class="oh-icon">📱</div>
    <div class="oh-text">よこむきに してね</div>
    <div class="oh-sub">よこむきに すると そうちが ぜんぶ みえるよ</div>
  </div>
  <script>document.addEventListener('contextmenu', function (e) { e.preventDefault(); });</script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
